<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Chatbot — Powered by OpenRouter</title>
  
  <!-- Inter & JetBrains Mono Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- MOBILE OVERLAY -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <div class="brand-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            </svg>
          </div>
          <span class="brand-name">AI Chatbot</span>
        </div>
        <button class="new-chat-btn" onclick="clearChat()" title="Start a new chat (Ctrl+N)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          <span>+ New Chat</span>
        </button>
      </div>

      <div class="sidebar-section">
        <span class="sidebar-section-title">Menu</span>
        <nav class="sidebar-menu" id="sidebarMenu">
          <button class="menu-item active" onclick="selectMenu(this, 'general')">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            </svg>
            <span>Chat</span>
          </button>
          <button class="menu-item" onclick="selectMenu(this, 'vision')">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <polyline points="21 15 16 10 5 21"/>
            </svg>
            <span>Image Analysis</span>
          </button>
          <button class="menu-item" onclick="selectMenu(this, 'code')">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="16 18 22 12 16 6"/>
              <polyline points="8 6 2 12 8 18"/>
            </svg>
            <span>Code Helper</span>
          </button>
          <button class="menu-item" onclick="selectMenu(this, 'summarize')">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="16" y1="13" x2="8" y2="13"/>
              <line x1="16" y1="17" x2="8" y2="17"/>
            </svg>
            <span>Summarize</span>
          </button>
        </nav>
      </div>

      <div class="sidebar-bottom">
        <div class="user-info">
          <div class="user-avatar">AS</div>
          <div class="user-details">
            <span class="user-name">Ananya Sharma</span>
            <span class="user-role">User</span>
          </div>
        </div>
      </div>
    </aside>

    <!-- MAIN CHAT AREA -->
    <main class="chat-main">

      <!-- HEADER -->
      <header class="chat-header">
        <div class="header-left">
          <button class="mobile-toggle-btn" id="mobileToggleBtn" aria-label="Toggle Sidebar">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="3" y1="12" x2="21" y2="12"/>
              <line x1="3" y1="6" x2="21" y2="6"/>
              <line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
          </button>
          
          <div class="header-title">
            <h2 id="sessionTitle">AI Assistant</h2>
            <div class="online-status">
              <span class="dot"></span>
              <span>Online</span>
            </div>
          </div>
        </div>

        <div class="header-actions">
          <button class="clear-btn" onclick="clearChat()" title="Clear Chat">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="3 6 5 6 21 6"/>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
            </svg>
            <span>Clear</span>
          </button>
        </div>
      </header>

      <!-- MESSAGES CONTAINER -->
      <div class="messages" id="messages">
        <!-- WELCOME EMPTY STATE -->
        <div class="welcome" id="welcome">
          <div class="welcome-content">
            <h2 class="welcome-title">Hello! How can I help you today? 👋</h2>
            <p class="welcome-subtitle">Ask me anything, upload an image, or get help with code.</p>

            <div class="suggestion-pills">
              <button class="chip" onclick="sendChip('What is artificial intelligence?')">
                <span>What is AI?</span>
              </button>
              <button class="chip" onclick="sendChip('Explain machine learning simply')">
                <span>Explain machine learning</span>
              </button>
              <button class="chip" onclick="sendChip('Write a poem about nature')">
                <span>Write a poem</span>
              </button>
              <button class="chip" onclick="sendChip('Give me a fun fact')">
                <span>Give me a fun fact</span>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- INPUT CONTAINER -->
      <div class="input-container" id="inputContainer">
        <!-- ATTACHMENT PREVIEW SLOT -->
        <div class="attachment-preview" id="imagePreviewContainer" style="display: none;">
          <img id="attachmentThumbnail" src="" alt="Attachment Preview"/>
          <div class="attachment-info">
            <span class="attachment-name" id="attachmentName">Image attached</span>
            <span class="attachment-size">Ready to send</span>
          </div>
          <button class="remove-attachment-btn" id="removeAttachmentBtn" title="Remove attachment">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>

        <div class="input-box">
          <button class="img-btn" id="imageBtn" title="Attach Image">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <polyline points="21 15 16 10 5 21"/>
            </svg>
          </button>

          <textarea
            id="userInput"
            placeholder="Type your message here..."
            rows="1"
            autocomplete="off"
          ></textarea>

          <button class="send-btn" id="sendBtn" title="Send Message">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="22" y1="2" x2="11" y2="13"/>
              <polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
          </button>
        </div>
        
        <input type="file" accept="image/*" id="imageInput" hidden />
        <div class="input-footer">
          <span class="disclaimer">AI can make mistakes. Please verify important information.</span>
        </div>
      </div>

    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
